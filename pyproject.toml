[project]
name = "makase-todo"
version = "0.1.0"
description = "A one-page to-do app to try makase on."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "python-multipart"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
