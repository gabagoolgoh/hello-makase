<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; form-action 'none'; base-uri 'none'"><meta name="color-scheme" content="light dark"><style>html,body{margin:0;height:100%;overflow:hidden!important}</style></head><body><style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 0.6rem auto; padding: 0 1rem; background: #ffffff; color: #000000; font-size: 14px; }
  h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
  p.remaining { margin: 0 0 0.45rem; }
  ul { padding-left: 1.2rem; margin: 0.25rem 0; }
  li { margin: 0.25rem 0; }
  form.done { display: inline; margin-left: 0.5rem; }
  form.add { display: flex; gap: 0.5rem; margin-top: 0.55rem; }
  form.add input { flex: 1; min-width: 0; }
</style>
<main>
  <h1>To-dos</h1>
  <p class="remaining">4 left</p>
  <ul>
    <li class="todo done"><s>Buy milk</s> <form class="done" onsubmit="return false"><button type="button">Undo</button></form></li>
    <li class="todo">Water the plants <form class="done" onsubmit="return false"><button type="button">Done</button></form></li>
    <li class="todo">Call the dentist <form class="done" onsubmit="return false"><button type="button">Done</button></form></li>
  </ul>
  <form class="add" onsubmit="return false">
    <input placeholder="What needs doing?" aria-label="New to-do" readonly>
    <button type="button">Add</button>
  </form>
</main></body></html>
