<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; form-action 'none'; base-uri 'none'"><meta name="color-scheme" content="light dark"><style>html,body{margin:0;height:100%;overflow:hidden!important}</style></head><body><style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px 12px; font-family: system-ui, sans-serif; font-size: 13px; background: #f4f4f2; color: #18181b; }
  .card { max-width: 32rem; margin: 0 auto; padding: 8px 12px; background: #ffffff; border: 1px solid #e4e4e7; border-radius: 8px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  h1 { margin: 0; font-size: 1.1rem; }
  .rem { margin: 0; font-size: 11px; color: #71717a; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-bottom: 6px; margin-bottom: 2px; border-bottom: 1px solid #f4f4f5; }
  .filters { display: flex; gap: 2px; }
  .f { padding: 2px 7px; font-size: 11px; color: #71717a; border-radius: 4px; }
  .f.on { color: #18181b; background: #f4f4f5; font-weight: 500; }
  .clear { padding: 2px 6px; font-size: 11px; color: #71717a; }
  ul { list-style: none; padding: 0; margin: 0 0 8px; }
  li { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #f4f4f5; }
  .box { width: 15px; height: 15px; border: 1.5px solid #a1a1aa; border-radius: 4px; flex-shrink: 0; position: relative; }
  .done .box { background: #2563eb; border-color: #2563eb; }
  .done .box::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #ffffff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .done .t { color: #a1a1aa; text-decoration: line-through; }
  .act { font-size: 11px; color: #71717a; }
  .add { display: flex; gap: 6px; }
  .inp { flex: 1; min-width: 0; padding: 4px 8px; font-size: 12px; color: #a1a1aa; background: #fafafa; border: 1px solid #d4d4d8; border-radius: 5px; }
  .btn { padding: 4px 10px; font-size: 12px; font-weight: 500; color: #ffffff; background: #2563eb; border-radius: 5px; }
</style>
<div class="card">
  <div class="head"><h1>To-dos</h1><p class="rem">1 left</p></div>
  <div class="bar">
    <div class="filters"><span class="f on">All</span><span class="f">Active</span><span class="f">Done</span></div>
    <span class="clear">Clear done</span>
  </div>
  <ul>
    <li class="done"><span class="box"></span><span class="t">Buy milk</span><span class="act">Edit · Delete</span></li>
    <li><span class="box"></span><span class="t">Water the plants</span><span class="act">Edit · Delete</span></li>
  </ul>
  <div class="add"><div class="inp">What needs doing?</div><div class="btn">Add</div></div>
</div></body></html>
